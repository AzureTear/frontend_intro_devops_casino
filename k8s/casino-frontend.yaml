apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: casino-frontend
  template:
    metadata:
      labels:
        app: casino-frontend
    spec:
      containers:
      - name: casino-frontend
        image: 742075245664.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest
        ports:
        - containerPort: 8080
        env:
        - name: BACKEND_HOST
          value: "casino-backend"
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: casino-frontend
spec:
  type: LoadBalancer
  selector:
    app: casino-frontend
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casino-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: casino-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
